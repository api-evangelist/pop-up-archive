name: Pop Up Archive
description: Pop Up Archive was a startup that provided audio and podcast transcription, speech-to-text,
  and searchable spoken-word archiving tools, making audio content discoverable and machine-readable.
  It was acquired by Apple in 2017 and its independent products, developer surface, and popuparchive.com
  domain were retired. The domain now resolves to Apple nameservers with no active host, so there is no
  live website, developer portal, documentation, or API to enrich. This profile was surfaced as a
  portfolio company of 500 Global and Bloomberg Beta and is retained in the API Evangelist network as a
  historical record; no live API surface remains.
